services:
  mysql:
    image: mysql:8.0
    container_name: cr_mysql
    restart: unless-stopped
    # 内存上限:防止任一容器吃爆 2C2G 整机内存触发内核 OOM 误杀其它服务
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./mysql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    container_name: cr_backend
    restart: unless-stopped
    # 内存上限:审查任务在后台线程跑,极端负载下封顶后只会重启 backend(orphan 回收兜底),
    # 而不会让内核 OOM 误杀 mysql,保护数据与演示稳定。正常占用 ~120M,768m 有充足余量。
    mem_limit: 768m
    depends_on:
      mysql:
        condition: service_healthy
    # JWT_SECRET / DEEPSEEK_* / CORS_ORIGINS 等从 .env 整体注入
    env_file: .env
    environment:
      APP_ENV: prod
      # 数据库连接固定指向 mysql 容器，账号直接复用 MYSQL_* 这套，避免填两遍
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cr_frontend
    restart: unless-stopped
    # nginx 静态服务,占用极小(~7M),128m 足够
    mem_limit: 128m
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Let's Encrypt 证书（只读给 nginx 用）+ ACME 续期校验 webroot
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  clamav:
    image: clamav/clamav:latest
    container_name: cr_clamav
    restart: unless-stopped
    # 有意不设 mem_limit:clamd 病毒库常驻,定期并发重载会短时翻倍(~1.2G),
    # 强行封顶会在重载瞬间被 OOM 杀掉;其内存有上界(库大小)且稳定,故放行。
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - code_review_net

volumes:
  mysql_data:
  clamav_data:

networks:
  code_review_net:
    driver: bridge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: "${LOG_MAX_FILES:-5}"

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: cr_mysql
    restart: unless-stopped
    mem_limit: ${MYSQL_MEM_LIMIT:-900m}
    cpus: ${MYSQL_CPUS:-1.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
      - --binlog-expire-logs-seconds=259200
      - --innodb-redo-log-capacity=268435456
      # ── 内存护栏：把 mysqld 常驻内存压进 mem_limit 安全区，防止 OOM 误杀 ──
      # 实测 mysqld 常驻 ~497MB，其中 performance_schema 占 ~150MB；关闭后
      # 叠加连接/临时表护栏，常驻可稳在 ~350MB 以下，为 343MB 大表备份留余量。
      - --performance-schema=OFF
      # 开启 SQL 审计日志到表，供安全监控只读采样数据库内部威胁（破坏性写/外泄）。
      # 通用查询日志会无界增长并进入全库备份；业务审计使用应用审计表。
      - --general-log=0
      - --log-output=TABLE
      - --innodb-buffer-pool-size=192M
      - --max-connections=60
      - --table-open-cache=512
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --thread-cache-size=16
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./mysql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "127.0.0.1:${MYSQL_BIND_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -uroot --batch --skip-column-names -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    networks:
      - code_review_net

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    container_name: cr_clamav
    restart: unless-stopped
    mem_limit: ${CLAMAV_MEM_LIMIT:-1400m}
    cpus: ${CLAMAV_CPUS:-1.5}
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    logging: *default-logging
    networks:
      - code_review_net

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: cr_redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    cpus: ${REDIS_CPUS:-0.25}
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *default-logging
    networks:
      - code_review_net

  # 本地嵌入服务(TEI, OpenAI 兼容 /v1/embeddings): 供 RAG 语义向量,
  # 仅容器内网可达, 无需外部 Key; ghcr 国内不可达, 镜像经本机拉取后
  # docker save/load 交付; 模型经 hf-mirror 下载到卷缓存。
  embedding:
    image: ${EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.3}
    container_name: cr_embedding
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    environment:
      - HF_ENDPOINT=${EMBEDDING_HF_ENDPOINT:-https://hf-mirror.com}
    # 优先用卷内离线模型(国内拉取 HF 模型不可达时由运维预置); 也可改回 HF 仓库 id
    command: ["--model-id", "${EMBEDDING_MODEL_ID:-/data/models/bge-small-zh-v1.5}", "--auto-truncate"]
    volumes:
      - embedding_model_cache:/data
# TEI 为 distroless 镜像(无 shell/wget), 健康由平台调用层兜底(嵌入失败自动降级)
    networks:
      - code_review_net

  backend:
    image: prism-backend:${BACKEND_RELEASE:-local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cr_backend
    user: "10001:991"
    group_add:
      - "992"
    restart: unless-stopped
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    cpus: ${BACKEND_CPUS:-1.5}
    depends_on:
      mysql:
        condition: service_healthy
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ${DEPLOY_ENV_FILE:-.env}
    environment:
      APP_ENV: prod
      APP_RELEASE: ${APP_RELEASE:-local}
      APP_VERSION: ${APP_VERSION:-3.8.0}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-5}
      CLAMAV_RECHECK_SECONDS: ${CLAMAV_RECHECK_SECONDS:-30}
      YARA_RULES_DIR: /app/deploy/yara/rules
      MALWARE_SCAN_FAIL_CLOSED: ${MALWARE_SCAN_FAIL_CLOSED:-true}
      YARA_MATCH_TIMEOUT: ${YARA_MATCH_TIMEOUT:-5}
      SOURCE_ARCHIVE_YARA_TOTAL_TIMEOUT: ${SOURCE_ARCHIVE_YARA_TOTAL_TIMEOUT:-300}
      REDIS_URL: redis://redis:6379/0
      OPS_EXECUTOR_SOCKET: /run/prism-ops/agent.sock
      SANDBOX_EXECUTOR_SOCKET: /var/lib/prism-sandbox/agent.sock
      # GeoLite2 是宿主机维护的只读生产数据源，不能随 release 工作区丢失。
      GEOLITE_DB_PATH: /app/GeoLite2-City.mmdb
    volumes:
      - ./yara/rules:/app/deploy/yara/rules:ro
      - /run/prism-ops:/run/prism-ops
      # 沙箱 socket 直接落在持久 StateDirectory:执行器 unlink+重建同一路径,
      # 挂载点始终跟随文件路径,执行器重启后容器内的 socket 引用依然有效
      # (tmpfs RuntimeDirectory 方案会因 /run private propagation 失效)。
      - /var/lib/prism-sandbox:/var/lib/prism-sandbox:ro
      - type: bind
        source: ${GEOLITE_DB_HOST_PATH:-/opt/code-review/backend/GeoLite2-City.mmdb}
        target: /app/GeoLite2-City.mmdb
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${BACKEND_BIND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:8000/healthz >/dev/null"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    logging: *default-logging
    networks:
      - code_review_net

  frontend:
    image: prism-frontend:${FRONTEND_RELEASE:-local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: ${APP_VERSION:-3.8.0}
        VITE_APP_RELEASE_SHA: ${APP_RELEASE:-local}
    container_name: cr_frontend
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    cpus: ${FRONTEND_CPUS:-0.5}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      APP_DOMAIN_ALIASES: ${APP_DOMAIN_ALIASES:-}
      SERVER_IP: ${SERVER_IP:-}
      NGINX_ENVSUBST_FILTER: ^(APP_DOMAIN|APP_DOMAIN_ALIASES|SERVER_IP)$$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - frontend_assets:/usr/share/nginx/html/assets
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    networks:
      - code_review_net

volumes:
  mysql_data:
  embedding_model_cache:
  clamav_data:
  frontend_assets:

networks:
  code_review_net:
    driver: bridge

# 诱捕层 TLS 服务端配置（独立监听 8443，不依赖主站 nginx 转发）。
#
# 为什么独立端口：v4.0.57—v4.0.62 六次尝试让主站 nginx 用 rewrite 把诱饵请求转到诱捕容器，
# 都因 nginx 内部重定向匹配导致死循环（500）。独立端口从根上避开这一整类问题：
# 主机侧用 ipset + DNAT 把已判定来源的 80/443 直接改写到本端口，诱捕层与主站互不干涉。
#
# 硬约束：只提供虚构内容；只读文件系统；pid/temp 全落 /tmp；不对外发布端口（仅宿主回环/内网）。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 256k;
    # 限制：防止被当作放大器（单 IP 6 r/s，突发 12）
    limit_req_zone $binary_remote_addr zone=decoy_rl:10m rate=6r/s;

    server {
        listen 8443 ssl;
        server_name _;
        resolver 127.0.0.11 valid=10s ipv6=off;
        ssl_certificate     /etc/letsencrypt/live/lijiadong.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lijiadong.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:2m;
        root /usr/share/nginx/html;
        index index.html;

        # 诱饵文件的类型映射：nginx 内置 mime.types 不认 .env/.bak 这类无扩展名或
        # 陌生后缀，会回落成 application/octet-stream，看起来就不像真配置。
        location ~ ^/\.env(\.|$) { default_type text/plain; try_files $uri =404; }
        location ~ ^/\.git/(HEAD|config)$ { default_type text/plain; try_files $uri =404; }
        location = /config.php.bak { default_type text/plain; try_files $uri =404; }
        location = /dump.sql { default_type application/sql; try_files $uri =404; }
        location ^~ /api/v1/internal/ { default_type application/json; try_files $uri =404; }

        # 单个通用位置：命中已有诱饵文件就返回它，否则回落到通用首页。
        # 不使用 rewrite、不使用 if，避免任何内部重定向。
        location / {
            limit_req zone=decoy_rl burst=12 nodelay;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;
        }

        # 伪备份包限速，避免被用来消耗我们上行带宽
        location ~ ^/(backup|dump|db)\.(zip|tar\.gz|sql)$ {
            limit_req zone=decoy_rl burst=6 nodelay;
            limit_rate 256k;
            try_files $uri =404;
        }
    }
}

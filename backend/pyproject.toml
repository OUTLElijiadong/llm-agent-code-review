[tool.ruff]
line-length = 120
target-version = "py39"
exclude = ["alembic/", ".venv/", "tests/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=app --cov-report=term-missing"
asyncio_mode = "auto"

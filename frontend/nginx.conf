# ────────────────────────────────────────────────────────────────
# HTTP(80)：IP 与域名都可直接访问；同时承载 Let's Encrypt 续期校验。
# 按用户选择「HTTP/HTTPS 都可用、不强制跳转」，80 端口照常提供完整应用。
# ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name lijiadong.cn www.lijiadong.cn 81.70.251.90 localhost;

    # 允许较大文件上传（代码/项目压缩包），nginx 默认仅 1MB 会导致 413
    client_max_body_size 50m;

    # Let's Encrypt ACME http-01 校验路径：certbot --webroot 把令牌写到此目录，
    # nginx 直接静态提供 → 证书续期零停机（必须放在 location / 之前命中）。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA 路由：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket 专用代理（必须放在 /api/ 之前,最长前缀匹配优先）
    # 圆桌讨论 WebSocket: /api/ws/discuss/{session_id}
    location /api/ws/ {
        proxy_pass http://backend:8000/api/ws/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # —— WebSocket 升级关键配置 ——
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 后端 API（含智能体 SSE 流式输出，必须关闭代理缓冲，否则实时输出会卡住）
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location = /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}

# ────────────────────────────────────────────────────────────────
# HTTPS(443)：受信任的 Let's Encrypt 证书（域名 lijiadong.cn）。
# 证书由 deploy/issue-cert.sh 首次签发、deploy/renew-cert.sh 续期，
# 经命名挂载 ./certbot/conf → /etc/letsencrypt 提供给本容器。
# ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name lijiadong.cn www.lijiadong.cn;

    client_max_body_size 50m;

    ssl_certificate     /etc/letsencrypt/live/lijiadong.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lijiadong.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location = /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}

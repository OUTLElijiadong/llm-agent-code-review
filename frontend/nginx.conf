# ────────────────────────────────────────────────────────────────
# HTTP(80)：IP 与域名都可直接访问；同时承载 Let's Encrypt 续期校验。
# 按用户选择「HTTP/HTTPS 都可用、不强制跳转」，80 端口照常提供完整应用。
# ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name lijiadong.cn www.lijiadong.cn 81.70.251.90 localhost;

    # 允许较大文件上传（代码/项目压缩包），nginx 默认仅 1MB 会导致 413
    client_max_body_size 50m;

    # Let's Encrypt ACME http-01 校验路径：certbot --webroot 把令牌写到此目录，
    # nginx 直接静态提供 → 证书续期零停机（必须放在 location / 之前命中）。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA 路由：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket 专用代理（必须放在 /api/ 之前,最长前缀匹配优先）
    # 圆桌讨论 WebSocket: /api/ws/discuss/{session_id}
    #
    # 超时配置说明（防止长连接意外断开）:
    #   - proxy_connect_timeout: 与后端建立连接的超时（120s 足够）
    #   - proxy_send_timeout: 向后端发送请求的超时（3600s,WebSocket 不主动发数据）
    #   - proxy_read_timeout: 读取后端响应的超时（3600s=1小时,圆桌讨论 Agent 思考
    #     可能超过 10 分钟,默认 600s 会误断;WebSocket 长连接靠心跳保活而非超时）
    #   - proxy_socket_keepalive: 开启 TCP keepalive,防止中间网络设备因空闲断连
    #   - send_timeout: 向客户端发送响应的超时（3600s,WebSocket 持续推送）
    #   - keepalive_timeout: HTTP keepalive 超时（75s,仅影响非 WS 的 HTTP 请求）
    location /api/ws/ {
        proxy_pass http://backend:8000/api/ws/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # —— WebSocket 升级关键配置 ——
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # —— 缓冲与缓存（必须关闭,WebSocket 需要实时透传）——
        proxy_buffering off;
        proxy_cache off;

        # —— 超时配置（WebSocket 长连接优化）——
        proxy_connect_timeout 120s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;

        # —— TCP keepalive（防止中间设备因空闲断连,nginx 1.15.6+）——
        proxy_socket_keepalive on;
    }

    # 后端 API（含智能体 SSE 流式输出，必须关闭代理缓冲，否则实时输出会卡住）
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location = /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}

# ────────────────────────────────────────────────────────────────
# HTTPS(443)：受信任的 Let's Encrypt 证书（域名 lijiadong.cn）。
# 证书由 deploy/issue-cert.sh 首次签发、deploy/renew-cert.sh 续期，
# 经命名挂载 ./certbot/conf → /etc/letsencrypt 提供给本容器。
#
# v2.4 B1 修复: 启用 HTTPS 解决 wss:// WebSocket 连接失败问题。
# 前端 discussionStream.ts 根据 window.location.protocol 选择 ws/wss,
# HTTP 访问用 ws://,HTTPS 访问用 wss://。若 HTTPS server block 缺失,
# wss:// 连接被拒绝 → 圆桌讨论 WebSocket 指数退避重连。
# ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name lijiadong.cn www.lijiadong.cn;

    client_max_body_size 50m;

    ssl_certificate     /etc/letsencrypt/live/lijiadong.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lijiadong.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA 路由：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket 专用代理（必须放在 /api/ 之前,最长前缀匹配优先）
    # 圆桌讨论 WebSocket: /api/ws/discuss/{session_id}
    # HTTPS 下使用 wss://,需与 HTTP server block 保持相同的 WS 升级配置
    # 超时配置与 HTTP server block 保持一致(3600s + TCP keepalive)
    location /api/ws/ {
        proxy_pass http://backend:8000/api/ws/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # —— WebSocket 升级关键配置 ——
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # —— 缓冲与缓存（必须关闭,WebSocket 需要实时透传）——
        proxy_buffering off;
        proxy_cache off;

        # —— 超时配置（WebSocket 长连接优化）——
        proxy_connect_timeout 120s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;

        # —— TCP keepalive（防止中间设备因空闲断连,nginx 1.15.6+）——
        proxy_socket_keepalive on;
    }

    # 后端 API（含智能体 SSE 流式输出，必须关闭代理缓冲，否则实时输出会卡住）
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location = /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}

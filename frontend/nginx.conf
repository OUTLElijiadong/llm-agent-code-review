user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    server_tokens off;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 诱捕层命中专用日志：以固定前缀落盘，宿主机 root 规则引擎按前缀提取来源 IP。
    # 该文件是诱捕层唯一的取证通道，不依赖模型、不依赖后端接口。
    log_format  decoy '$remote_addr - [$time_iso8601] "$request" $status '
                      '$body_bytes_sent "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    # 诱捕签名：命中即路由到诱捕容器，请求绝不进入真 backend。
    # 客户端永远看不到命中的是诱饵——判定只发生在服务端内部。
    # 用 $uri（规范化后的当前 URI）而不是 $request_uri：rewrite 到 /__prism_decoy 之后
    # $request_uri 仍是原始路径，会再次命中并造成内部重定向死循环（v4.0.60 生产实测 500）。
    # 捕获组用 $1（位置捕获），避免在 location 内误用命名捕获变量。
    map $uri $prism_decoy {
        default                              0;
        "~*(/\\.env|/\\.git/|/\\.svn/|/\\.aws/|/\\.ssh/|/\\.kube/|/wp-admin|/wp-login\\.php|/wp-json|/xmlrpc\\.php|/phpmyadmin|/pma/|/adminer\\.php|/manager/html|/actuator/|/solr/|/credentials\\.json|/backup\\.(zip|tar\\.gz|sql)|/dump\\.sql|/config\\.php\\.bak|/server-status|/api/v1/internal/)" "1";
    }

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml text/xml image/svg+xml application/wasm font/woff font/woff2;
    gzip_vary on;
    gzip_proxied any;

    include /etc/nginx/conf.d/*.conf;
    # 诱捕层路由（frontend/nginx.decoy.conf）当前处于停用状态：
    # v4.0.57—v4.0.62 六次尝试都未能让 https 命中稳定转发到诱捕容器，
    # 表现为内部重定向死循环（500）。为避免给真实扫描器提供"这条路径会报 500"的
    # 异常指纹，先停用整条路由，恢复 404/SPA 兜底的正常行为；诱捕容器与代码保留。
    # 详见 docs/主动欺骗与网络隔离设计20261005/诱捕层路由排查与停用.md
}

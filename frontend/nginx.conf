user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    server_tokens off;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 诱捕层命中专用日志：以固定前缀落盘，宿主机 root 规则引擎按前缀提取来源 IP。
    # 该文件是诱捕层唯一的取证通道，不依赖模型、不依赖后端接口。
    log_format  decoy '$remote_addr - [$time_iso8601] "$request" $status '
                      '$body_bytes_sent "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    # 诱捕签名：命中即路由到诱捕容器，请求绝不进入真 backend。
    # 客户端永远看不到命中的是诱饵——判定只发生在服务端内部。
    map $request_uri $prism_decoy {
        default                              0;
        "~*(?<decoy_path>/\\.env|/\\.git/|/\\.svn/|/\\.aws/|/\\.ssh/|/\\.kube/|/wp-admin|/wp-login\\.php|/wp-json|/xmlrpc\\.php|/phpmyadmin|/pma/|/adminer\\.php|/manager/html|/actuator/|/solr/|/credentials\\.json|/backup\\.(zip|tar\\.gz|sql)|/dump\\.sql|/config\\.php\\.bak|/server-status|/api/v1/internal/)" "1";
    }

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml text/xml image/svg+xml application/wasm font/woff font/woff2;
    gzip_vary on;
    gzip_proxied any;

    include /etc/nginx/conf.d/*.conf;
    # 诱捕层服务端配置（虚构内容 + 限流 + 仅内网可达）
    include /etc/nginx/prism-decoy.conf;
}

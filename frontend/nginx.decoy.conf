# 诱捕层（decoy）服务端配置：只提供虚构内容，不接触任何真实数据。
# 该文件由 frontend/nginx.conf 中的 include 直接引入到 http 块；envsubst 不处理它。
#
# 设计约束（见 docs/主动欺骗与网络隔离设计20261005/DESIGN_主动欺骗与网络隔离.md）：
#   1. 命中诱饵的请求由 cr_frontend 反向代理到这里，真 backend 完全不参与；
#   2. 只用同一份 Let's Encrypt 证书对外应答，客户端不会看到"自签"这种破绽；
#   3. 内容全部为虚构，禁止放入任何真实密钥、真实域名凭据或真实数据；
#   4. 限流与响应体上限防止被当作放大器使用。

geo $prism_decoy_internal {
    default 0;
    127.0.0.1/32 1;
    172.16.0.0/12 1;
    10.0.0.0/8 1;
}

limit_req_zone $binary_remote_addr zone=prism_decoy_rl:10m rate=6r/s;

# $time_iso8601 为 ISO8601，宿主机解析与排序都直接可用
log_format prism_decoy '$remote_addr - [$time_iso8601] "$request" $status '
                       '$body_bytes_sent "$http_user_agent" "$http_referer"';
access_log /var/log/prism-decoy/access.log prism_decoy;

upstream prism_decoy_backend {
    server cr_decoy:8080 max_fails=0;
    keepalive 4;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # 只有来自 nginx 自身/容器内网的请求才会被路由到诱捕容器；
    # 公网直连 80 端口一律 308 跳转，行为与主站一致，不暴露诱捕层的存在。
    location = /__prism_decoy {
        if ($prism_decoy_internal = 0) { return 308 https://$host$request_uri; }
        limit_req zone=prism_decoy_rl burst=12 nodelay;
        limit_except GET HEAD POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Prism-Decoy-Path $decoy_path;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_pass http://prism_decoy_backend;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}
